<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f1e8" />
    <meta name="description" content="충남·충북·대전방면 청년 활동 사진 전시" />
    <title>마음과 마음을 잇는 청년의 발자취</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#branch-switcher">방면 선택으로 건너뛰기</a>
    <main class="exhibition" id="app">
      <header class="hero-header">
        <p class="eyebrow">KOREA × JAPAN YOUTH EXCHANGE</p>
        <h1>마음과 마음을 잇는<br class="title-break" /> 청년의 발자취</h1>
        <p class="subtitle">지도에서 방면을 선택해 활동의 순간을 만나보세요.</p>
      </header>

      <nav class="branch-switcher" id="branch-switcher" aria-label="방면 선택"></nav>

      <section class="stage">
        <section class="map-panel" aria-label="대한민국 지도에서 방면 선택">
          <div class="map-shell">
            <div class="map-heading" aria-hidden="true">
              <span>REPUBLIC OF KOREA</span>
              <strong>충남 · 충북 · 대전</strong>
            </div>

            <svg class="korea-map" viewBox="0 0 780 760" role="group" aria-labelledby="map-title map-desc">
              <title id="map-title">대한민국 지도와 충남, 충북, 대전방면</title>
              <desc id="map-desc">낮은 대비의 대한민국 실루엣 위에 전시 대상 세 방면을 시군 단위의 단순화된 도형으로 표시한 지도입니다.</desc>
              <defs>
                <filter id="context-shadow" x="-30%" y="-30%" width="160%" height="160%">
                  <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#15203b" flood-opacity="0.13" />
                </filter>
                <filter id="selected-shadow" x="-45%" y="-45%" width="190%" height="190%">
                  <feDropShadow dx="0" dy="16" stdDeviation="13" flood-color="#15203b" flood-opacity="0.34" />
                </filter>
                <pattern id="paper-dots" width="18" height="18" patternUnits="userSpaceOnUse">
                  <circle cx="2" cy="2" r="0.8" fill="#17233b" opacity="0.08" />
                </pattern>
              </defs>

              <g class="country-context" aria-hidden="true">
                <path class="country-mainland" d="M482 57 C520 86 542 129 552 175 C565 232 610 256 619 310 C628 365 594 400 586 447 C577 501 606 532 574 574 C548 608 509 619 492 666 C480 700 453 729 420 708 C386 687 391 649 365 625 C337 598 289 587 274 547 C258 504 281 468 266 429 C251 391 209 370 218 323 C227 278 267 262 284 222 C303 178 292 126 328 91 C366 54 435 24 482 57 Z" />
                <path class="country-island" d="M336 709 C365 690 410 691 438 711 C415 735 363 742 336 709 Z" />
                <path class="country-island small" d="M527 587 C538 580 552 582 559 591 C548 599 535 599 527 587 Z" />
                <path class="country-island small" d="M274 423 C283 415 294 416 301 425 C290 432 280 431 274 423 Z" />
              </g>

              <g id="branch-map-layer"></g>

              <g class="map-annotation" aria-hidden="true">
                <line x1="167" y1="610" x2="612" y2="610" />
                <text x="167" y="635">전시용 단순화 지도 · 실제 행정 경계와 다를 수 있습니다</text>
              </g>
            </svg>

            <div class="map-legend" id="map-legend" aria-label="지도 범례"></div>
          </div>
        </section>

        <section class="gallery-panel" aria-label="활동 사진 전시" aria-hidden="true">
          <div class="gallery-head">
            <button class="back-button" type="button" aria-label="전체 지도로 돌아가기">
              <span aria-hidden="true">←</span> 전체 지도
            </button>
            <div class="gallery-intro">
              <p class="gallery-kicker" id="gallery-kicker">YOUTH ACTIVITIES</p>
              <h2 id="gallery-title">방면을 선택해 주세요</h2>
              <p id="gallery-description"></p>
              <p class="boundary-note" id="boundary-note"></p>
              <ul class="municipality-list" id="municipality-list" aria-label="포함 지역"></ul>
            </div>
          </div>

          <div class="category-tabs" role="tablist" aria-label="활동 유형">
            <button type="button" role="tab" id="tab-all" data-category="all" aria-controls="photo-grid" aria-selected="true">전체</button>
            <button type="button" role="tab" id="tab-discussion" data-category="discussion" aria-controls="photo-grid" aria-selected="false" tabindex="-1">좌담회</button>
            <button type="button" role="tab" id="tab-school" data-category="school" aria-controls="photo-grid" aria-selected="false" tabindex="-1">창가청년스쿨</button>
            <button type="button" role="tab" id="tab-future" data-category="future" aria-controls="photo-grid" aria-selected="false" tabindex="-1">청년미래총회</button>
            <button type="button" role="tab" id="tab-daily" data-category="daily" aria-controls="photo-grid" aria-selected="false" tabindex="-1">평상시 활동</button>
          </div>

          <div class="gallery-summary" aria-live="polite">
            <span id="photo-count">0장의 기록</span>
            <span id="gallery-status">사진을 눌러 크게 볼 수 있습니다.</span>
          </div>
          <div class="photo-grid" id="photo-grid" role="tabpanel" aria-labelledby="tab-all" tabindex="0"></div>
        </section>
      </section>

      <footer class="exhibition-footer">
        <span>충남 · 충북 · 대전 청년부</span>
        <span>사람과 지역을 잇는 평화의 연대</span>
      </footer>
    </main>

    <dialog class="lightbox" id="lightbox" aria-labelledby="lightbox-caption">
      <button class="lightbox-close" type="button" aria-label="사진 닫기">×</button>
      <button class="lightbox-nav previous" type="button" aria-label="이전 사진">‹</button>
      <figure>
        <img id="lightbox-image" alt="" />
        <figcaption id="lightbox-caption"></figcaption>
      </figure>
      <button class="lightbox-nav next" type="button" aria-label="다음 사진">›</button>
    </dialog>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
